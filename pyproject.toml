[project]
name = "project-utopia"
# PEP-440 compatible projection of the human-readable tag "0.11.0-py-rc1".
# The original string is preserved verbatim at ``project_utopia.__version__``.
version = "0.11.0rc1"
description = "Academic benchmark for LLM long-horizon planning + multi-resource allocation (Python port)."
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "Project Utopia contributors" },
]
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydantic>=2.7",
  "litellm>=1.40",
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3",
  "hypothesis>=6",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.scripts]
project-utopia = "project_utopia.cli.benchmark_paper:app"
project-utopia-determinism = "project_utopia.tools.audit.determinism_check:main"
project-utopia-rng-audit = "project_utopia.tools.audit.rng_coverage_report:main"

[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["project_utopia"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["project_utopia", "tests"]
extend-exclude = ["src", "node_modules", "docs", "scripts", "server", "test", "tools"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF",
]
ignore = [
  "E501", # line-length is enforced by formatter; long strings are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["project_utopia"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
  "asyncio: marks tests using pytest-asyncio",
  "slow: marks slow tests",
]
